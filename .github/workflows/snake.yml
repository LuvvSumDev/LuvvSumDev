name: snake
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#6B4C8A&color_dots=#EBEDF0,#D8CDE8,#B8A3D6,#8E6BB8,#4B2E5E
            dist/snake-dark.svg?palette=github-dark&color_snake=#B8A3D6&color_dots=#1C1424,#2A1B3D,#4B2E5E,#6B4C8A,#B8A3D6
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
