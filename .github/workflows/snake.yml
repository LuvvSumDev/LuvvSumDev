name: snake
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#9E1B1B&color_dots=#2a2522,#5A0E0E,#7a1414,#9E1B1B,#c62828
            dist/snake-dark.svg?palette=github-dark&color_snake=#9E1B1B&color_dots=#161b22,#3b0d0d,#5A0E0E,#9E1B1B,#e53935
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
